        24% { opacity: 1; }
        67% { opacity: 1; }
        68% { opacity: 0.85; }
        69% { opacity: 1; }
      }

      .vh-tracking-1 { animation: vhTracking 6s linear infinite; }
      .vh-tracking-2 { animation: vhTracking2 8s linear infinite; }
      .vh-jitter { animation: vhJitter 4s ease-in-out infinite; }
