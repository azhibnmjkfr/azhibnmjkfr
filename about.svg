      .vh-scanline { animation: vhScanline 4s linear infinite; }
      .vh-time { animation: vhTime 3s ease-in-out infinite; }
      .vh-blink { animation: vhBlink 1s step-end infinite; }
      .vh-flicker { animation: vhFlicker 3s ease-in-out infinite; }
    </style>
