<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="SIGNAL.OUT — connect">
  <defs>
    <radialGradient id="sgBgGrad" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="sgGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="50%" stop-color="#ffe680"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>

    <linearGradient id="sgWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fff0" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00fff0" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ff00aa" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#ffcc00" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00fff0" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sgHoloGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00fff0" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ff00aa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Gradient border kiri-kanan -->
    <linearGradient id="sgBorderCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fff0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00fff0" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sgBorderMagenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff00aa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff00aa" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sgBorderGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0"/>
    </linearGradient>

    <filter id="sgSoftGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="sgNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
    </filter>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Courier New', monospace; }

      @keyframes sgWave {
        0% { transform: translateX(0); }
        100% { transform: translateX(-320px); }
      }

      @keyframes sgWaveSlow {
        0% { transform: translateX(0); }
        100% { transform: translateX(-640px); }
      }

      @keyframes sgHolo {
        0%, 100% { opacity: 1; }
        45% { opacity: 1; }
        46% { opacity: 0.7; }
        47% { opacity: 1; }
        78% { opacity: 1; }
        79% { opacity: 0.85; }
        80% { opacity: 1; }
      }

      @keyframes sgBar1 {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.4); }
      }

      @keyframes sgBar2 {
        0%, 100% { transform: scaleY(0.6); }
        50% { transform: scaleY(1); }
      }

      @keyframes sgBar3 {
        0%, 100% { transform: scaleY(0.8); }
        50% { transform: scaleY(0.3); }
      }

      @keyframes sgHoloScan {
        0% { transform: translateY(0); opacity: 0; }
        10% { opacity: 0.6; }
        90% { opacity: 0.6; }
        100% { transform: translateY(116px); opacity: 0; }
      }

      @keyframes sgLed {
        0%, 49%, 100% { opacity: 1; }
        50%, 99% { opacity: 0.15; }
      }

      @keyframes sgBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes sgData {
        0%, 90%, 100% { opacity: 0.7; }
        92% { opacity: 0.2; }
        94% { opacity: 1; }
        96% { opacity: 0.4; }
      }

      @keyframes sgChannelGlitch {
        0%, 100% { transform: translate(0, 0); filter: none; }
        88% { transform: translate(0, 0); filter: none; }
        89% { transform: translate(-2px, 1px); filter: hue-rotate(-15deg); }
        90% { transform: translate(2px, -1px); filter: hue-rotate(15deg); }
        91% { transform: translate(-1px, 0); filter: none; }
        92% { transform: translate(1px, 1px); filter: hue-rotate(-10deg); }
        93% { transform: translate(0, 0); filter: none; }
        94% { opacity: 0.85; }
        95% { opacity: 1; }
      }

      @keyframes sgTextGlitchCyan {
        0%, 100% { transform: translateX(0); opacity: 0; }
        88% { transform: translateX(0); opacity: 0; }
        89% { transform: translateX(-2px); opacity: 0.8; }
        91% { transform: translateX(2px); opacity: 0.8; }
        93% { transform: translateX(0); opacity: 0; }
      }

      @keyframes sgTextGlitchMagenta {
        0%, 100% { transform: translateX(0); opacity: 0; }
        88% { transform: translateX(0); opacity: 0; }
        89% { transform: translateX(2px); opacity: 0.8; }
        91% { transform: translateX(-2px); opacity: 0.8; }
        93% { transform: translateX(0); opacity: 0; }
      }

      @keyframes sgSlice {
        0%, 100% { transform: translateX(0); opacity: 0; }
        87% { transform: translateX(0); opacity: 0; }
        88% { transform: translateX(-8px); opacity: 1; }
        89% { transform: translateX(6px); opacity: 1; }
        90% { transform: translateX(-3px); opacity: 0.6; }
        91% { transform: translateX(0); opacity: 0; }
      }

      /* Garis tepi card kiri — muncul saat hover */
      @keyframes sgEdgeGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }

      .sg-wave { animation: sgWave 4s linear infinite; }
      .sg-wave-slow { animation: sgWaveSlow 8s linear infinite; }
      .sg-holo { animation: sgHolo 3s ease-in-out infinite; }
      .sg-holo-scan { animation: sgHoloScan 3s linear infinite; }
      .sg-led { animation: sgLed 1.2s step-end infinite; }
      .sg-blink { animation: sgBlink 1s step-end infinite; }
      .sg-data { animation: sgData 2.5s ease-in-out infinite; }
      .sg-edge { animation: sgEdgeGlow 4s ease-in-out infinite; }

      .sg-bar1 { animation: sgBar1 1.2s ease-in-out infinite; transform-origin: center bottom; transform-box: fill-box; }
      .sg-bar2 { animation: sgBar2 1.5s ease-in-out infinite; transform-origin: center bottom; transform-box: fill-box; }
      .sg-bar3 { animation: sgBar3 1.8s ease-in-out infinite; transform-origin: center bottom; transform-box: fill-box; }

      .sg-ch-1 { animation: sgChannelGlitch 5s ease-in-out infinite; }
      .sg-ch-2 { animation: sgChannelGlitch 5.5s ease-in-out infinite 0.8s; }
      .sg-ch-3 { animation: sgChannelGlitch 6s ease-in-out infinite 1.6s; }
      .sg-ch-4 { animation: sgChannelGlitch 5.2s ease-in-out infinite 2.4s; }

      .sg-t-cyan-1 { animation: sgTextGlitchCyan 5s ease-in-out infinite; }
      .sg-t-mag-1 { animation: sgTextGlitchMagenta 5s ease-in-out infinite; }
      .sg-t-cyan-2 { animation: sgTextGlitchCyan 5.5s ease-in-out infinite 0.8s; }
      .sg-t-mag-2 { animation: sgTextGlitchMagenta 5.5s ease-in-out infinite 0.8s; }
      .sg-t-cyan-3 { animation: sgTextGlitchCyan 6s ease-in-out infinite 1.6s; }
      .sg-t-mag-3 { animation: sgTextGlitchMagenta 6s ease-in-out infinite 1.6s; }
      .sg-t-cyan-4 { animation: sgTextGlitchCyan 5.2s ease-in-out infinite 2.4s; }
      .sg-t-mag-4 { animation: sgTextGlitchMagenta 5.2s ease-in-out infinite 2.4s; }

      .sg-slice-1 { animation: sgSlice 5s ease-in-out infinite; }
      .sg-slice-2 { animation: sgSlice 5.5s ease-in-out infinite 0.8s; }
      .sg-slice-3 { animation: sgSlice 6s ease-in-out infinite 1.6s; }
      .sg-slice-4 { animation: sgSlice 5.2s ease-in-out infinite 2.4s; }
    </style>
  </defs>

  <rect width="1280" height="480" fill="url(#sgBgGrad)"/>
  <rect width="1280" height="480" filter="url(#sgNoise)" opacity="0.5"/>

  <ellipse cx="300" cy="240" rx="320" ry="180" fill="#00fff0" opacity="0.06" filter="url(#sgSoftGlow)"/>
  <ellipse cx="980" cy="300" rx="300" ry="180" fill="#ff00aa" opacity="0.05" filter="url(#sgSoftGlow)"/>

  <g opacity="0.15">
    <path class="sg-wave-slow" d="M -320 440 Q -240 420 -160 440 T 0 440 T 160 440 T 320 440 T 480 440 T 640 440 T 800 440 T 960 440 T 1120 440 T 1280 440 T 1440 440 T 1600 440" stroke="url(#sgWaveGrad)" stroke-width="1.5" fill="none"/>
    <path class="sg-wave" d="M -320 460 Q -240 445 -160 460 T 0 460 T 160 460 T 320 460 T 480 460 T 640 460 T 800 460 T 960 460 T 1120 460 T 1280 460 T 1440 460 T 1600 460" stroke="url(#sgWaveGrad)" stroke-width="1" fill="none" opacity="0.7"/>
    <path class="sg-wave-slow" d="M -320 478 Q -240 468 -160 478 T 0 478 T 160 478 T 320 478 T 480 478 T 640 478 T 800 478 T 960 478 T 1120 478 T 1280 478 T 1440 478 T 1600 478" stroke="url(#sgWaveGrad)" stroke-width="1" fill="none" opacity="0.5" style="animation-delay: 2s"/>
  </g>

