    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Courier New', monospace; }

      /* Animasi ringan: Hanya kedipan halus (pulse) */
      @keyframes sgPulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }

      @keyframes sgBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .sg-led { animation: sgBlink 1.2s step-end infinite; }
      .sg-blink { animation: sgBlink 1s step-end infinite; }
      .sg-edge-pulse { animation: sgPulse 3s ease-in-out infinite; }
      
      .card-hover:hover rect:first-child { stroke: #00fff0; stroke-width: 2; }
    </style>
  </defs>

