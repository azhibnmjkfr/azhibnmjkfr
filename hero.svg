    <line x1="0" y1="500" x2="1280" y2="500" stroke="#1a1a2a" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="600" stroke="#1a1a2a" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="600" stroke="#1a1a2a" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="600" stroke="#1a1a2a" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="600" stroke="#1a1a2a" stroke-width="0.5"/>
