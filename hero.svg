<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-label="Azhibnmjkfr">
  <defs>
    <linearGradient id="hxGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="50%" stop-color="#ffe680"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>

    <radialGradient id="hxBgGrad" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <filter id="hxSoftGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hxNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
    </filter>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Courier New', monospace; }

      @keyframes hxSplitCyan {
        0%, 78%, 100% { transform: translateX(0); opacity: 0; }
        80% { transform: translateX(-3px); opacity: 0.8; }
        84% { transform: translateX(3px); opacity: 0.8; }
        88% { transform: translateX(-2px); opacity: 0.5; }
        92% { transform: translateX(0); opacity: 0; }
      }

      @keyframes hxSplitMagenta {
        0%, 78%, 100% { transform: translateX(0); opacity: 0; }
        80% { transform: translateX(3px); opacity: 0.8; }
        84% { transform: translateX(-3px); opacity: 0.8; }
        88% { transform: translateX(2px); opacity: 0.5; }
        92% { transform: translateX(0); opacity: 0; }
      }

      @keyframes hxSlice1 {
        0%, 80%, 100% { transform: translateX(0); opacity: 0; }
        82% { transform: translateX(-6px); opacity: 1; }
        86% { transform: translateX(4px); opacity: 1; }
        90% { transform: translateX(-2px); opacity: 0.6; }
        94% { transform: translateX(0); opacity: 0; }
      }

      @keyframes hxSlice2 {
        0%, 84%, 100% { transform: translateX(0); opacity: 0; }
        86% { transform: translateX(8px); opacity: 1; }
        90% { transform: translateX(-4px); opacity: 1; }
        94% { transform: translateX(3px); opacity: 0.5; }
        96% { transform: translateX(0); opacity: 0; }
      }

      @keyframes hxFlicker {
        0%, 100% { opacity: 1; }
        47% { opacity: 1; }
        48% { opacity: 0.75; }
        49% { opacity: 1; }
        75% { opacity: 1; }
        76% { opacity: 0.85; }
        77% { opacity: 1; }
      }

      @keyframes hxScanline {
        0% { transform: translateY(-600px); opacity: 0; }
        8% { opacity: 1; }
        92% { opacity: 1; }
        100% { transform: translateY(600px); opacity: 0; }
      }

      @keyframes hxScanlineFast {
        0% { transform: translateY(-600px); opacity: 0; }
        5% { opacity: 0.8; }
        95% { opacity: 0.8; }
        100% { transform: translateY(600px); opacity: 0; }
      }

      @keyframes hxBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes hxData {
        0%, 90%, 100% { opacity: 0.7; }
        92% { opacity: 0.2; }
        94% { opacity: 1; }
        96% { opacity: 0.4; }
      }

      @keyframes hxBorder {
        0%, 88%, 100% { stroke-opacity: 0.3; }
        90% { stroke-opacity: 0.9; }
        92% { stroke-opacity: 0.1; }
        94% { stroke-opacity: 0.7; }
      }

      @keyframes hxLed {
        0%, 49%, 100% { opacity: 1; }
        50%, 99% { opacity: 0.15; }
      }

      @keyframes hxGlitchBar {
        0%, 88%, 100% { opacity: 0; transform: scaleX(0); }
        90% { opacity: 1; transform: scaleX(1); }
        92% { opacity: 0.4; transform: scaleX(0.6); }
        94% { opacity: 0; transform: scaleX(0); }
      }

      @keyframes hxGlitchBar2 {
        0%, 76%, 100% { opacity: 0; transform: scaleX(0); }
        78% { opacity: 0.8; transform: scaleX(1); }
        80% { opacity: 0.3; transform: scaleX(0.4); }
        82% { opacity: 0; transform: scaleX(0); }
      }

      .hx-name { animation: hxFlicker 3s ease-in-out infinite; }
      .hx-cyan { animation: hxSplitCyan 3.2s ease-in-out infinite; }
      .hx-magenta { animation: hxSplitMagenta 3.2s ease-in-out infinite; }
      .hx-slice1 { animation: hxSlice1 3.2s ease-in-out infinite; }
      .hx-slice2 { animation: hxSlice2 3.2s ease-in-out infinite; }
      .hx-scanline { animation: hxScanline 3.5s linear infinite; }
      .hx-scanline-fast { animation: hxScanlineFast 1.8s linear infinite; }
      .hx-blink { animation: hxBlink 1s step-end infinite; }
      .hx-data { animation: hxData 2.5s ease-in-out infinite; }
      .hx-border { animation: hxBorder 3s ease-in-out infinite; }
      .hx-led { animation: hxLed 1.2s step-end infinite; }
      .hx-glitchbar { animation: hxGlitchBar 4s ease-in-out infinite; transform-origin: 0 50%; transform-box: view-box; }
      .hx-glitchbar2 { animation: hxGlitchBar2 5s ease-in-out infinite; transform-origin: 0 50%; transform-box: view-box; }

      /* === TYPING EMAIL: kursor kotak kuning yang memproduksi huruf === */
      @keyframes hxCursorMove {
        0%      { transform: translateX(0); }
        6%      { transform: translateX(0); }
        50%     { transform: translateX(220.1px); }
        78%     { transform: translateX(220.1px); }
        94%     { transform: translateX(0); }
        100%    { transform: translateX(0); }
      }
      @keyframes hxTypeReveal {
        0%      { clip-path: inset(0 220.1px 0 0); }
        6%      { clip-path: inset(0 220.1px 0 0); }
        50%     { clip-path: inset(0 0px 0 0); }
        78%     { clip-path: inset(0 0px 0 0); }
        94%     { clip-path: inset(0 220.1px 0 0); }
        100%    { clip-path: inset(0 220.1px 0 0); }
      }
      @keyframes hxCursorBlink {
        0%, 50%   { opacity: 1; }
        51%, 54%  { opacity: 0; }
        55%, 59%  { opacity: 1; }
        60%, 64%  { opacity: 0; }
        65%, 69%  { opacity: 1; }
        70%, 74%  { opacity: 0; }
        75%, 100% { opacity: 1; }
      }
      .hx-cursor { animation: hxCursorMove 6s linear infinite; transform-box: fill-box; }
      .hx-email-reveal { animation: hxTypeReveal 6s linear infinite; }
      .hx-cursor-blink { animation: hxCursorBlink 6s step-end infinite; }
    </style>
  </defs>

  <rect width="1280" height="600" fill="url(#hxBgGrad)"/>

  <g opacity="0.15">
    <line x1="0" y1="100" x2="1280" y2="100" stroke="#1a1a2a" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1280" y2="200" stroke="#1a1a2a" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1280" y2="300" stroke="#1a1a2a" stroke-width="0.5"/>
