<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="DATAMOSH.STACK — tools">
  <defs>
    <radialGradient id="dmBgGrad" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="dmGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="50%" stop-color="#ffe680"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>

    <filter id="dmSoftGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dmNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.07"/>
      </feComponentTransfer>
    </filter>

    <filter id="dmPixelSort">
      <feTurbulence type="turbulence" baseFrequency="0.01 0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
    </filter>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Courier New', monospace; }

      @keyframes dmBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes dmLed {
        0%, 49%, 100% { opacity: 1; }
        50%, 99% { opacity: 0.15; }
      }

      @keyframes dmData {
        0%, 90%, 100% { opacity: 0.7; }
        92% { opacity: 0.2; }
        94% { opacity: 1; }
        96% { opacity: 0.4; }
      }

      @keyframes dmMosh1 {
        0%, 82%, 100% { transform: translate(0, 0); opacity: 0; }
        84% { transform: translate(-6px, 2px); opacity: 1; }
        88% { transform: translate(4px, -2px); opacity: 1; }
        92% { transform: translate(-2px, 1px); opacity: 0.6; }
        96% { transform: translate(0, 0); opacity: 0; }
      }

      @keyframes dmMosh2 {
        0%, 68%, 100% { transform: translate(0, 0); opacity: 0; }
        70% { transform: translate(5px, -3px); opacity: 0.9; }
        74% { transform: translate(-4px, 2px); opacity: 0.9; }
        78% { transform: translate(2px, -1px); opacity: 0.5; }
        82% { transform: translate(0, 0); opacity: 0; }
      }

      @keyframes dmSlice {
        0%, 100% { transform: translateX(0); opacity: 0.5; }
        46% { transform: translateX(0); opacity: 0.5; }
        47% { transform: translateX(-8px); opacity: 1; }
        48% { transform: translateX(6px); opacity: 0.8; }
        49% { transform: translateX(0); opacity: 0.5; }
        82% { transform: translateX(0); opacity: 0.5; }
        83% { transform: translateX(10px); opacity: 1; }
        84% { transform: translateX(-4px); opacity: 0.7; }
        85% { transform: translateX(0); opacity: 0.5; }
      }

      @keyframes dmCorrupt {
        0%, 88%, 100% { opacity: 0.4; }
        90% { opacity: 1; }
        92% { opacity: 0.2; }
        94% { opacity: 0.9; }
        96% { opacity: 0.4; }
      }

      @keyframes dmCardGlitch {
        0%, 100% { transform: translate(0, 0); }
        88% { transform: translate(0, 0); }
        89% { transform: translate(-2px, 1px); }
        90% { transform: translate(2px, -1px); }
        91% { transform: translate(-1px, 0); }
        92% { transform: translate(1px, 1px); }
        93% { transform: translate(0, 0); }
      }

      .dm-blink { animation: dmBlink 1s step-end infinite; }
      .dm-led { animation: dmLed 1.2s step-end infinite; }
      .dm-data { animation: dmData 2.5s ease-in-out infinite; }
      .dm-mosh1 { animation: dmMosh1 4s ease-in-out infinite; }
      .dm-mosh2 { animation: dmMosh2 5s ease-in-out infinite; }
      .dm-slice { animation: dmSlice 4.5s ease-in-out infinite; }
      .dm-corrupt { animation: dmCorrupt 3s ease-in-out infinite; }

      .dm-card-1 { animation: dmCardGlitch 5s ease-in-out infinite; }
      .dm-card-2 { animation: dmCardGlitch 5.5s ease-in-out infinite 0.6s; }
      .dm-card-3 { animation: dmCardGlitch 6s ease-in-out infinite 1.2s; }
      .dm-card-4 { animation: dmCardGlitch 5.2s ease-in-out infinite 1.8s; }
      .dm-card-5 { animation: dmCardGlitch 5.8s ease-in-out infinite 2.4s; }
      .dm-card-6 { animation: dmCardGlitch 5.4s ease-in-out infinite 3s; }
      .dm-card-7 { animation: dmCardGlitch 5.6s ease-in-out infinite 3.6s; }
      .dm-card-8 { animation: dmCardGlitch 5.1s ease-in-out infinite 4.2s; }
    </style>
  </defs>

